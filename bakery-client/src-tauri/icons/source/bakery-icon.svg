<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Bakery app icon: a scored, golden loaf glowing in an oven-dark squircle.
       Source for every file in ../: render it to a 1024px PNG, then
       `pnpm tauri icon <png> -o <dir>` and copy over the files ../ already has. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3a40"/>
      <stop offset="0.55" stop-color="#12191d"/>
      <stop offset="1" stop-color="#0a0c0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="640" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffa449" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#ff7a2a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8cd7a"/>
      <stop offset="0.45" stop-color="#e09a42"/>
      <stop offset="1" stop-color="#9a5420"/>
    </linearGradient>
    <linearGradient id="crumb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3d2"/>
      <stop offset="1" stop-color="#f3c77a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b2c0e" stop-opacity="0"/>
      <stop offset="1" stop-color="#5b2c0e" stop-opacity="0.55"/>
    </linearGradient>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="188"/></clipPath>
    <clipPath id="loaf"><path id="loafShape" d="M236 640 C236 452 358 336 512 336 C666 336 788 452 788 640 C788 716 704 752 512 752 C320 752 236 716 236 640 Z"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.42"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="loafShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- steam -->
    <g fill="none" stroke="#e9f4f2" stroke-linecap="round" stroke-width="22" opacity="0.34" filter="url(#soft)">
      <path d="M424 300 C396 262 452 236 424 192"/>
      <path d="M512 280 C484 238 540 212 512 160"/>
      <path d="M600 300 C572 262 628 236 600 192"/>
    </g>
    <!-- loaf -->
    <g filter="url(#loafShadow)">
      <use href="#loafShape" fill="url(#crust)"/>
    </g>
    <g clip-path="url(#loaf)">
      <!-- baked shoulder light and base shade -->
      <ellipse cx="420" cy="420" rx="250" ry="120" fill="#fff" opacity="0.2" transform="rotate(-14 420 420)" filter="url(#soft)"/>
      <rect x="236" y="560" width="552" height="200" fill="url(#base)"/>
      <!-- scoring: three long cuts, each opening onto pale crumb with a lifted ear -->
      <g fill="url(#crumb)" stroke="#8a4a1b" stroke-width="6" stroke-opacity="0.55" stroke-linejoin="round">
        <path d="M330 600 C368 520 420 470 470 446 C452 492 404 560 352 618 Z"/>
        <path d="M444 624 C484 530 548 470 610 440 C588 496 530 572 468 642 Z"/>
        <path d="M578 620 C610 556 652 514 694 494 C680 540 640 594 598 634 Z"/>
      </g>
      <g fill="none" stroke="#fff6dc" stroke-width="7" stroke-linecap="round" opacity="0.7">
        <path d="M470 446 C452 492 404 560 352 618"/>
        <path d="M610 440 C588 496 530 572 468 642"/>
        <path d="M694 494 C680 540 640 594 598 634"/>
      </g>
    </g>
    <!-- glass rim light -->
    <rect x="102" y="102" width="820" height="820" rx="186" fill="none" stroke="url(#rim)" stroke-width="4"/>
  </g>
</svg>
